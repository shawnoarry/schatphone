    <path d="M234 700 390 532l112 116 84-80 204 190H250a24 24 0 0 1-16-58Z" fill="#24bcb7" stroke="#111827" stroke-width="24" stroke-linejoin="round"/>
    <path d="m420 424 184 288M604 424 420 712" fill="none" stroke="#ff2f53" stroke-width="50" stroke-linecap="round"/>
    <circle cx="838" cy="842" r="104" fill="#ffc341" stroke="#111827" stroke-width="24"/>
    <path d="M838 780v76M838 892v4" fill="none" stroke="#111827" stroke-width="34" stroke-linecap="round"/>
