    <pattern id="checker" width="88" height="88" patternUnits="userSpaceOnUse">
      <rect width="88" height="88" fill="#ffffff"/>
      <rect width="44" height="44" fill="#ff2fa6"/>
      <rect x="44" y="44" width="44" height="44" fill="#ff2fa6"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="28" stdDeviation="24" flood-color="#111827" flood-opacity="0.22"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <rect x="84" y="84" width="856" height="856" rx="188" fill="#ffffff" stroke="#111827" stroke-width="28"/>
    <path d="M268 84h568a104 104 0 0 1 104 104v72H84v-72A104 104 0 0 1 188 84h80Z" fill="url(#checker)"/>
