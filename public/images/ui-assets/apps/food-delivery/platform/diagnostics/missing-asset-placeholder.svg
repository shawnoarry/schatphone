<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Missing visual asset placeholder</title>
  <desc id="desc">A high-contrast broken image marker used to identify artwork slots that still need a final PNG.</desc>
