name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Require main for manual deploy
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' }}
        run: |
          echo "Manual Pages deployment must run from main." >&2
          exit 1

      - name: Checkout
        uses: actions/checkout@v5

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --registry=https://registry.npmjs.org/

      - name: Audit all dependencies
        run: npm audit --registry=https://registry.npmjs.org/

      - name: Verify project assets are published
        run: npm run assets:check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        env:
          SCHATPHONE_RELEASE_COMMIT: ${{ github.sha }}
        run: npm run build:github

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Full product E2E
        id: full-e2e
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:5182
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/playwright-results.json
        run: npm run test:e2e -- --fail-on-flaky-tests --reporter=line,html,json

      - name: Verify Playwright summary
        id: playwright-summary
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/playwright-results.json
        run: >-
          node -e "const fs = require('node:fs'); const report = JSON.parse(fs.readFileSync(process.env.PLAYWRIGHT_JSON_OUTPUT_FILE, 'utf8')); const { skipped = 0, unexpected = 0, flaky = 0 } = report.stats || {}; console.log(JSON.stringify({ skipped, unexpected, flaky })); if (skipped > 4 || unexpected !== 0 || flaky !== 0) process.exit(1)"

      - name: Upload Playwright report
        if: ${{ failure() && (steps.full-e2e.outcome == 'failure' || steps.playwright-summary.outcome == 'failure') }}
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
            test-results/playwright-results.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
