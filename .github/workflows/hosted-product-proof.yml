name: Hosted Product Proof

on:
  workflow_run:
    workflows: ['Deploy to GitHub Pages']
    types: [completed]
  workflow_dispatch:
    inputs:
      commit:
        description: Exact main commit to verify; defaults to the dispatched revision
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: hosted-product-proof-${{ github.event.workflow_run.head_sha || inputs.commit || github.sha }}
  cancel-in-progress: true

jobs:
  proof:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PROOF_COMMIT: ${{ github.event.workflow_run.head_sha || inputs.commit || github.sha }}
      PLAYWRIGHT_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      SCHATPHONE_EXPECTED_COMMIT: ${{ github.event.workflow_run.head_sha || inputs.commit || github.sha }}

    steps:
      - name: Checkout exact deployed revision
        uses: actions/checkout@v5
        with:
          ref: ${{ env.PROOF_COMMIT }}

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify hosted PWA and complete recovery
        run: npm run test:e2e:hosted

      - name: Upload hosted proof report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: hosted-product-proof-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
